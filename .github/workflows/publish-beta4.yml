name: Publish reviewed beta.4 prerelease

on:
  push:
    branches: [release/beta4-public-preview1-20261106]

permissions: {}

concurrency:
  group: overxelis-beta4-public-preview1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'FrogHollowFirewood/overxelis-miner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify and publish the fixed reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B tools/publish-beta4-release.py
